<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Photo Gallery</title>
  <link rel="stylesheet" href="css/gallery.css">
  <script src="js/gallery.js"></script>
</head>

<body>

  <h1>Interactive Photo Gallery</h1>

  <div id="image">
    Hover over an image below to display here.
  </div>

  <div class="gallery">
    <img class="preview" alt="Styling with a Bandana" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon.jpg" onmouseover="upDate(this)" onmouseout="unDo()">

    <img class="preview" alt="With My New Lamb" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon2.JPG" onmouseover="upDate(this)" onmouseout="unDo()">

    <img class="preview" alt="Young Puppy" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon3.jpg" onmouseover="upDate(this)" onmouseout="unDo()">

    <img class="preview" alt="Sitting near the statue in Gallup Park" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/baconGallup.jpg" onmouseover="upDate(this)" onmouseout="unDo()">

    <img class="preview" alt="Exploring in the deep woods" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/baconWoods.png" onmouseover="upDate(this)" onmouseout="unDo()">

    <img class="preview" alt="Resting near the stick fort" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/baconFort.png" onmouseover="upDate(this)" onmouseout="unDo()">
  </div>

</body>

</html>
